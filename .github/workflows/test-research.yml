name: Verify TradeMargin search API
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/test-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix worker test
