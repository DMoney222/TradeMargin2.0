name: Probe live TradeMargin retailer pricing
on:
  push:
    branches: [main]
    paths:
      - 'worker/probe/**'
      - '.github/workflows/probe-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node worker/probe/live.mjs
